  benchmark: ["H0", "H2", "H3", "H4", "H5", "H6"]
  debug: ["H0", "H1", "H2", "H3", "H4", "H5", "H6"]
  research: ["H0", "H1", "H2", "H3", "H6"]
max_items_per_list: 4
task_shapes:
  single_surface: t0
  delegated_once: t1
  shared_state: t2
  multi_step: t2
